name: rentals
region: blr

services:
  - name: api
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    github:
      repo: your-github-user/rentals
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
    envs:
      - key: APP_NAME
        value: Rentals API
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: ${rentals-db.DATABASE_URL}
        type: SECRET
      - key: JWT_SECRET_KEY
        value: replace-in-digitalocean
        type: SECRET
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://your-flutter-web-app.vercel.app"]'

databases:
  - name: rentals-db
    engine: PG
    version: "16"
    production: false
