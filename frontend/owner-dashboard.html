<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Owner dashboard | bigsocieties.com</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="owner">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="bigsocieties.com home">
        <span class="brand-mark">B</span>
        <span>bigsocieties.com</span>
      </a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="./index.html#listings">Listings</a>
        <a href="./tenant-dashboard.html">Tenants</a>
        <a class="active" href="./owner-dashboard.html">Owners</a>
      </nav>
      <div class="topbar-actions">
        <button class="ghost-button" id="open-login" type="button">Sign in</button>
      </div>
    </header>

    <main>
      <section class="dashboard-shell dashboard-page-hero" id="owner-dashboard">
        <div class="dashboard-heading">
          <div>
            <p class="eyebrow">Owner dashboard</p>
            <h2>Create cheaper, cleaner listings with enough detail to close faster.</h2>
          </div>
          <button class="primary-button" id="load-owner-listings" type="button">Refresh my listings</button>
        </div>

        <div class="owner-dashboard-grid">
          <form class="dashboard-panel listing-editor" id="create-listing-form">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">Create listing</p>
                <h3>Property details</h3>
              </div>
              <span class="draft-badge">Draft first</span>
            </div>
            <div class="form-grid">
              <label>Title <input id="owner-title" required minlength="5" value="2 BHK in a verified society" /></label>
              <label>Property type <select id="owner-property-type"><option value="flat">Flat</option><option value="plot">Plot</option></select></label>
              <label>Rent <input id="owner-rent" required type="number" min="1" step="1000" value="35000" /></label>
              <label>Deposit <input id="owner-deposit" required type="number" min="0" step="1000" value="100000" /></label>
              <label>City <input id="owner-city" required value="Bengaluru" /></label>
              <label>Locality <input id="owner-locality" required value="HSR Layout" /></label>
              <label>Bedrooms <input id="owner-bedrooms" type="number" min="0" max="20" value="2" /></label>
              <label>Bathrooms <input id="owner-bathrooms" type="number" min="0" max="20" value="2" /></label>
              <label>Area sqft <input id="owner-area" type="number" min="1" value="1100" /></label>
              <label>Furnishing <select id="owner-furnishing"><option value="">Not applicable</option><option value="unfurnished">Unfurnished</option><option value="semi_furnished" selected>Semi furnished</option><option value="fully_furnished">Fully furnished</option></select></label>
              <label>Latitude <input id="owner-latitude" required type="number" step="0.000001" value="12.9352" /></label>
              <label>Longitude <input id="owner-longitude" required type="number" step="0.000001" value="77.6245" /></label>
            </div>
            <label>Address <input id="owner-address" required value="Society main gate road" /></label>
            <label>Description <textarea id="owner-description" required minlength="20">Direct owner listing with clean rent, deposit, amenities, and quick visit coordination.</textarea></label>
            <label>Amenities <input id="owner-amenities" value="parking, security, power backup" /></label>
            <label>Image URLs <textarea id="owner-images" placeholder="One image URL per line">https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=1100&q=78</textarea></label>
            <div class="form-grid">
              <label>Facing <input id="owner-facing" value="east" /></label>
              <label>Parking type <input id="owner-parking-type" value="covered" /></label>
              <label>Society rules <input id="owner-rules" placeholder="Family preferred, pets allowed..." /></label>
              <label>Available from <input id="owner-available-from" type="date" /></label>
            </div>
            <div class="form-actions">
              <button class="primary-button" type="submit">Create draft</button>
              <output id="owner-create-output"></output>
            </div>
          </form>

          <aside class="dashboard-panel owner-list-panel">
            <div class="panel-heading">
              <div>
                <p class="eyebrow">My listings</p>
                <h3>Drafts and published homes</h3>
              </div>
            </div>
            <div class="owner-listings" id="owner-listings"></div>
          </aside>
        </div>
      </section>
    </main>

    <dialog class="auth-dialog" id="auth-dialog">
      <form method="dialog" class="dialog-shell">
        <button class="close-button" aria-label="Close" value="cancel">×</button>
        <div>
          <h2>Account access</h2>
          <p>Sign in or create a tenant/owner account.</p>
        </div>
        <div class="segmented-control auth-tabs" role="tablist" aria-label="Authentication mode">
          <button class="segment active" type="button" data-auth-mode="login">Sign in</button>
          <button class="segment" type="button" data-auth-mode="register">Register</button>
        </div>
        <label>Email <input id="login-email" type="email" autocomplete="email" /></label>
        <label>Password <input id="login-password" type="password" autocomplete="current-password" /></label>
        <div class="register-only">
          <label>Role <select id="register-role"><option value="tenant">Tenant</option><option value="owner">Owner</option></select></label>
          <label>Phone <input id="register-phone" type="tel" autocomplete="tel" placeholder="Optional" /></label>
        </div>
        <button class="primary-button" id="login-button" type="button">Sign in</button>
        <output id="login-output"></output>
      </form>
    </dialog>

    <script src="./config.js"></script>
    <script src="./app.js" type="module"></script>
  </body>
</html>
