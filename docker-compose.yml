services:
  api:
    build:
      context: ./backend
    container_name: rentals-api
    environment:
      APP_NAME: "Rentals API"
      ENVIRONMENT: local
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://rentals:rentals@postgres:5432/rentals_users
      JWT_SECRET_KEY: local-development-secret-change-for-prod
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: rentals-frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: rentals-postgres
    environment:
      POSTGRES_DB: rentals_users
      POSTGRES_USER: rentals
      POSTGRES_PASSWORD: rentals
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentals -d rentals_users"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
